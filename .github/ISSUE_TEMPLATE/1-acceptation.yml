name: "🚨 CYRAVA tapped an accept button / CYRAVA a cliqué sur une acceptation"
description: "Serious bug — CYRAVA must NEVER tap “Accept”, “Allow”, a purchase or a subscription. / Bug grave — CYRAVA ne doit JAMAIS cliquer sur « Accepter », « Autoriser », un achat ou un abonnement."
title: "[ACCEPTATION] "
body:
  - type: markdown
    attributes:
      value: |
        🇬🇧 Thank you! This is the most serious bug possible for CYRAVA: it will be handled first.
        Pause CYRAVA (quick tile or Home button) until it is fixed. You can write in English or French.

        🇫🇷 Merci ! C'est le bug le plus grave possible pour CYRAVA : il sera traité en priorité.
        Mettez CYRAVA en pause (tuile rapide ou bouton de l'accueil) en attendant la correction. Vous pouvez écrire en anglais ou en français.
  - type: input
    id: app
    attributes:
      label: "App or site concerned / Appli ou site concerné"
      description: "App name, or site address and browser (Chrome, Firefox…). / Nom de l'appli, ou adresse du site et navigateur (Chrome, Firefox…)."
      placeholder: "e.g. / ex. boursorama.com — Firefox"
    validations:
      required: true
  - type: input
    id: bouton
    attributes:
      label: "Exact text of the button CYRAVA tapped / Texte exact du bouton cliqué par CYRAVA"
      placeholder: "e.g. / ex. Accept and close — Accepter et fermer"
    validations:
      required: true
  - type: input
    id: telephone
    attributes:
      label: "Phone and Android version / Téléphone et version d'Android"
      placeholder: "e.g. / ex. Samsung Galaxy S23 FE, Android 16"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "CYRAVA version / Version de CYRAVA"
      description: "Settings › About, or name of the installed APK file. / Réglages › À propos, ou nom du fichier APK installé."
  - type: dropdown
    id: profil
    attributes:
      label: "Profile used / Profil utilisé"
      options:
        - "Careful / Prudent"
        - Strict
        - Observation
        - "I don't know / Je ne sais pas"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "What happened / Ce qui s'est passé"
      description: "What you saw, in order. A screenshot helps a lot. / Ce que vous avez vu, dans l'ordre. Une capture d'écran aide beaucoup."
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: "Diagnostic file (strongly recommended) / Fichier de diagnostic (fortement conseillé)"
      description: |
        🇬🇧 Settings › Diagnostic centre › Share, then attach the file here.
        If GitHub refuses the `.json` file, add `.txt` to the end of its name.
        ⚠️ This file contains the text shown on screen: read it before attaching it.

        🇫🇷 Réglages › Centre de diagnostic › Partager, puis joignez le fichier ici.
        Si GitHub refuse le fichier `.json`, ajoutez `.txt` à la fin de son nom.
        ⚠️ Ce fichier contient le texte affiché à l'écran : relisez-le avant de le joindre.
